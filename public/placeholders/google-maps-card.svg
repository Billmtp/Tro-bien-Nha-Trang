<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 533" width="100%" height="100%">
  <defs>
    <linearGradient id="mapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF3FD"/>
      <stop offset="100%" stop-color="#D7E6FA"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Map Grid Style -->
  <rect width="800" height="533" fill="url(#mapBg)"/>

  <!-- Map Roads Grid Simulation -->
  <path d="M-50 150 Q 300 200 850 100" stroke="#FFFFFF" stroke-width="26" fill="none" opacity="0.7"/>
  <path d="M-50 350 Q 400 300 850 420" stroke="#FFFFFF" stroke-width="20" fill="none" opacity="0.7"/>
  <path d="M250 -50 L 320 600" stroke="#FFFFFF" stroke-width="22" fill="none" opacity="0.6"/>
  <path d="M600 -50 L 550 600" stroke="#FFFFFF" stroke-width="16" fill="none" opacity="0.5"/>
  <path d="M100 480 Q 450 420 850 500" stroke="#D0E2FC" stroke-width="14" fill="none"/>

  <!-- Water area simulation -->
  <path d="M680 0 Q 720 250 800 533 L 800 0 Z" fill="#90CAF9" opacity="0.35"/>

  <!-- Center Marker Card -->
  <g transform="translate(400, 266)">
    <!-- Red Pin Icon -->
    <g transform="translate(0, -110)" filter="url(#shadow)">
      <path d="M0 -35 C-20 -35 -35 -20 -35 0 C-35 25 0 55 0 55 C0 55 35 25 35 0 C35 -20 20 -35 0 -35 Z" fill="#EA4335"/>
      <circle cx="0" cy="-2" r="13" fill="#FFFFFF"/>
      <circle cx="0" cy="-2" r="7" fill="#C5221F"/>
    </g>

    <!-- Source Badge -->
    <rect x="-160" y="-30" width="320" height="34" rx="17" fill="#1A73E8" opacity="0.95" filter="url(#shadow)"/>
    <text x="0" y="-8" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">
      🗺️ ĐỊA ĐIỂM XÁC THỰC GOOGLE MAPS
    </text>

    <!-- Title -->
    <text x="0" y="45" fill="#202124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="27" font-weight="800" text-anchor="middle">
      Nhà Trọ Có Tọa Độ GPS &amp; SĐT
    </text>

    <!-- Subtitle -->
    <text x="0" y="82" fill="#5F6368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" text-anchor="middle">
      Đã định vị chính xác vị trí • Hỗ trợ mở chỉ đường trực tiếp
    </text>

    <!-- Action Pill -->
    <g transform="translate(0, 130)">
      <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#1A73E8" filter="url(#shadow)"/>
      <text x="0" y="5" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
        Bấm xem bản đồ &amp; Số điện thoại ↗
      </text>
    </g>
  </g>
</svg>
