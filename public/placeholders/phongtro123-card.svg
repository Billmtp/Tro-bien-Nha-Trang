<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 533" width="100%" height="100%">
  <defs>
    <linearGradient id="pt123Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E03C31"/>
      <stop offset="100%" stop-color="#A71D14"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="533" fill="url(#pt123Grad)"/>

  <!-- Subtle circles pattern -->
  <circle cx="100" cy="80" r="140" fill="white" opacity="0.05"/>
  <circle cx="720" cy="450" r="180" fill="white" opacity="0.05"/>

  <!-- Center Card Content -->
  <g transform="translate(400, 266)">
    <!-- House Key Icon -->
    <g transform="translate(0, -115)" filter="url(#shadow)">
      <rect x="-42" y="-42" width="84" height="84" rx="22" fill="#FFFFFF"/>
      <path d="M-22 4 L0 -18 L22 4 L14 4 L14 20 L4 20 L4 10 L-4 10 L-4 20 L-14 20 L-14 4 Z" fill="#E03C31"/>
    </g>

    <!-- Source Badge -->
    <rect x="-140" y="-35" width="280" height="34" rx="17" fill="white" opacity="0.2"/>
    <text x="0" y="-13" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" letter-spacing="1.5" text-anchor="middle">
      PHONGTRO123.COM
    </text>

    <!-- Title -->
    <text x="0" y="45" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" text-anchor="middle">
      Kênh Cho Thuê Phòng Trọ Nha Trang
    </text>

    <!-- Subtitle -->
    <text x="0" y="85" fill="#FFCDD2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" text-anchor="middle">
      Thông tin phòng trọ, nhà trọ sinh viên, công nhân giá rẻ
    </text>

    <!-- Hint Pill -->
    <g transform="translate(0, 135)">
      <rect x="-130" y="-18" width="260" height="36" rx="18" fill="white" opacity="0.95" filter="url(#shadow)"/>
      <text x="0" y="5" fill="#E03C31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
        Bấm xem chi tiết &amp; Liên hệ ↗
      </text>
    </g>
  </g>
</svg>
